<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timetable Generator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='2' width='14' height='13' rx='2' fill='%232f5bea'/%3E%3Cpath d='M1 6h14M5 6v9M10 6v9' stroke='white' stroke-width='1.2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Timetable Generator</span>
      </div>
      <nav id="nav" aria-label="Main">
        <a href="#/overview" data-route="overview">Overview</a>
        <a href="#/generate" data-route="generate">Generate</a>
        <a href="#/timetable" data-route="timetable">Timetable</a>
        <a href="#/constraints" data-route="constraints">Constraints</a>
        <div class="nav-section">Data</div>
        <div id="nav-data"></div>
      </nav>
      <div class="sidebar-foot">
        <a href="/docs" target="_blank" rel="noopener">API docs</a>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-button menu-toggle" id="menu-toggle" aria-label="Toggle navigation">☰</button>
        <h1 id="page-title">Overview</h1>
        <div class="topbar-actions" id="page-actions"></div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <dialog id="form-dialog" class="dialog">
    <form method="dialog" id="record-form" novalidate>
      <header class="dialog-head">
        <h2 id="form-title">Edit</h2>
        <button type="button" class="icon-button" data-close aria-label="Close">✕</button>
      </header>
      <div class="dialog-body" id="form-fields"></div>
      <p class="form-error" id="form-error" role="alert"></p>
      <footer class="dialog-foot">
        <button type="button" class="button" data-close>Cancel</button>
        <button type="submit" class="button primary" id="form-submit">Save</button>
      </footer>
    </form>
  </dialog>

  <dialog id="confirm-dialog" class="dialog dialog-small">
    <form method="dialog">
      <div class="dialog-body"><p id="confirm-text"></p></div>
      <footer class="dialog-foot">
        <button value="cancel" class="button">Cancel</button>
        <button value="ok" class="button danger">Delete</button>
      </footer>
    </form>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="/static/app.js" type="module"></script>
</body>
</html>
